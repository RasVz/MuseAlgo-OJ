# ============================================================
# MuseAlgo-OJ — 生产编排（单机 Docker Compose）
# ------------------------------------------------------------
# 与 compose.dev.yml 的分工：
#   compose.dev.yml          开发用：容器内跑 Maven / Vite dev server，源码挂载 + 热更新
#   docker-compose.prod.yml  生产用：跑发行镜像（编译好的 jar + 静态产物），精简运行时
#
# 三步上线：
#   1) 构建镜像（必须在仓库根目录执行，构建上下文是仓库根）
#        推荐：scripts/build-release.sh   # 串行构建 + 注入 OCI 追溯标签 + 生成发行清单
#        或手动：
#        docker build -f deploy/Dockerfile.backend  -t musealgo-oj/backend:latest  .
#        docker build -f deploy/Dockerfile.frontend -t musealgo-oj/frontend:latest .
#   2) 准备密钥
#        cp .env.example .env
#        vi .env            # 填JWT及三种独立DB口令；然后 chmod 600 .env
#   3) 启动并自检
#        docker compose -f docker-compose.prod.yml up -d
#        curl -fsS localhost:8080/actuator/health      # 期望 {"status":"UP"}
#
# 访问入口
#   站点        http://<服务器地址>/                       前端（Nginx，/api 反代到后端）
#   健康检查    http://127.0.0.1:8080/actuator/health     默认只绑本机，供运维探活
#   就绪探针    http://127.0.0.1:8080/actuator/health/readiness
#
# 服务分工：backend 只承接站点流量（报告调度/通知投递关闭）；report-worker 是报告生成与
# 通知投递的唯一实例，不映射端口，unhealthy 时以退出码 70 受控退出并由 restart 策略重启，
# 重启上限见 OJ_REPORT_WORKER_MAX_RESTART_ATTEMPTS。两者必须恰好各一个启用实例。
#
# 首次启动 MySQL 会执行结构基线与账号脚本；migrate成功后才启用业务账号服务
# （基线 + Flyway 历史，不含任何业务数据）。演示数据用 scripts/db-seed.sh，
# 生产环境千万不要导入演示账号。
#
# 判题机 Judge0 需要 privileged 权限，刻意不放在本文件里，见 docs/DEPLOYMENT.md 第五节；
# 用下面的 JUDGE0_URLS 指向它即可。
# ============================================================
name: musealgo-prod

services:
  # ---------------- 数据库：MySQL 8.0（不对外暴露端口）----------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${OJ_DB_ROOT_PASS:?必须设置独立的 OJ_DB_ROOT_PASS}
      MYSQL_USER: musealgo_migrator
      MYSQL_PASSWORD: ${OJ_DB_MIGRATION_PASS:?必须设置独立的 OJ_DB_MIGRATION_PASS}
      OJ_DB_PASS: ${OJ_DB_PASS:?必须设置应用账号 OJ_DB_PASS（至少32位十六进制）}
      MYSQL_DATABASE: oj_db
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅当数据卷为空时执行：建立表结构基线（含 Flyway 历史，缺它空库起不来）
      - ./docker/mysql-init/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./docker/mysql-init/01-reference-roles.sql:/docker-entrypoint-initdb.d/01-reference-roles.sql:ro
      - ./deploy/mysql-users.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h127.0.0.1 -uroot --batch --skip-column-names oj_db -e "SELECT 1 FROM flyway_schema_history LIMIT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [backend-net]

  # ---------------- 缓存：Redis（不对外暴露端口）----------------
  redis:
    image: redis:6.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend-net]

  # Migration is a separate one-shot process with DDL privileges. Runtime has CRUD only.
  migrate:
    image: ${BACKEND_IMAGE:-musealgo-oj/backend:latest}
    restart: "no"
    entrypoint: ["java", "-cp", "/app/app.jar", "-Dloader.main=com.musealgo.oj.FlywayMigrationRunner", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    # 镜像自带 /actuator/health 探针；一次性迁移进程不提供 HTTP，显式关闭以免编排等待健康状态。
    healthcheck:
      disable: true
    environment:
      OJ_DB_HOST: mysql
      OJ_DB_MIGRATION_PASS: ${OJ_DB_MIGRATION_PASS:?required}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend-net]

  # ---------------- 后端：发行镜像（编译好的 jar + JRE）----------------
  backend:
    image: ${BACKEND_IMAGE:-musealgo-oj/backend:latest}
    restart: unless-stopped
    environment:
      # 容器网络内按服务名寻址（覆盖 .env 里的 127.0.0.1）
      OJ_DB_HOST: mysql
      OJ_DB_USER: musealgo_app
      TZ: Asia/Shanghai
      OJ_DB_PASS: ${OJ_DB_PASS:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: prod
      OJ_API_DOCS_PUBLIC: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:-}
      COS_BASE_URL: ${COS_BASE_URL:-}
      OJ_SLIDEV_BUILD_TIMEOUT_SECONDS: ${OJ_SLIDEV_BUILD_TIMEOUT_SECONDS:-120}
      JUDGE0_PER_PROCESS_MEMORY_LIMIT: ${JUDGE0_PER_PROCESS_MEMORY_LIMIT:-true}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      OJ_REDIS_HOST: redis
      # 判题机地址；未部署 Judge0 时留空，判题不可用但其余功能不受影响
      JUDGE0_URLS: ${JUDGE0_URLS:-}
      # 未部署 RabbitMQ / Meilisearch 时关闭，避免 /actuator/health 恒为 DOWN
      OJ_RABBITMQ_ENABLED: "false"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      OJ_SEARCH_ENABLED: "false"
      # 单 jar 部署没有「源码工作区」目录树，课件路径必须给绝对路径
      # （镜像内工作目录就是 /app；见 SlidevPathProvider）
      OJ_SLIDEV_WORKER_DIR: /app/OJ-Slidev
      OJ_SLIDEV_OUTPUT_DIR: /app/OJ-Coursewares
      # 判题用例与上传目录：必须与下面的命名卷挂载点一致，
      # 否则用例会被写进容器临时层，重建即丢。
      OJ_TESTCASE_PATH: /data/testcases
      OJ_UPLOAD_DIR: /data/uploads
      # 留空表示「同源相对地址」：未配置 COS 时后端返回 /uploads/<uuid>.<ext>，
      # 由前端 Nginx 的 /uploads/ 路由（只读挂载同一卷）提供，浏览器可直接访问。
      # 若要生成绝对地址（例如后端与站点不同源），在 .env 里设置 OJ_PUBLIC_BASE_URL。
      OJ_PUBLIC_BASE_URL: ${OJ_PUBLIC_BASE_URL:-}
      # 报告相关的「单实例职责」全部交给下面的 report-worker 服务，web 实例一律关闭。
      # 契约要求恰好一个报告 worker 与一个通知 dispatcher（scripts/report_worker_preflight.py 会校验）；
      # 更重要的是 web 实例必须关闭 exit-on-unhealthy —— 报告渲染卡死时不能把在线用户流量一起带走。
      OJ_REPORT_WORKER_ENABLED: "false"
      OJ_REPORT_NOTIFICATION_WORKER_ENABLED: "false"
      OJ_REPORT_WEEKLY_ENABLED: "false"
      OJ_REPORT_RETENTION_CLEANUP_ENABLED: "false"
      OJ_REPORT_AI_ADVICE_ENABLED: ${OJ_REPORT_AI_ADVICE_ENABLED:-false}
      OJ_SETTLEMENT_REPLAY_ENABLED: ${OJ_SETTLEMENT_REPLAY_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx2g}
      OJ_DB_POOL_SIZE: ${OJ_DB_POOL_SIZE:-20}
    volumes:
      # 判题用例、上传文件、课件产物都必须落在持久卷上，容器重建不丢
      - testcase-data:/data/testcases
      - uploads-data:/data/uploads
      - coursewares-data:/app/OJ-Coursewares
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 禁止容器内进程通过 setuid/setgid 提权（后端本就是以非 root musealgo 运行）。
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # 镜像自带 curl；健康检查通过意味着「真的连上库、Flyway 已跑完、应用已就绪」
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    ports:
      # 默认只绑本机：对外一律走前端 Nginx 的 /api，不要直接暴露 8080
      # （与开发栈同机并行时需要改 BACKEND_PORT / WEB_PORT，否则端口冲突）
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    networks: [backend-net]

  # ---------------- 报告 worker：与 web 分实例，专责报告生成/通知投递/留存 ----------------
  # 为什么要拆开：worker 进入 unhealthy 后会受控退出（OJ_REPORT_WORKER_EXIT_ON_UNHEALTHY=true），
  # 由下面的 restart_policy 拉起，形成「卡死 → 退出 → 重启 → lease 过期回收 → 任务继续」的闭环。
  # 这个退出必须只发生在不承接用户流量的实例上，所以报告职责不能留在 backend 里。
  # 不发布任何端口：worker 不需要对外提供 HTTP，8080 仅供容器内 healthcheck 使用。
  report-worker:
    image: ${BACKEND_IMAGE:-musealgo-oj/backend:latest}
    # restart 与 deploy.restart_policy 同时给出：max_attempts 是 crash-loop 上限，
    # 超过后容器保持 exited 而不是无限重启（已实测 RestartCount=3 后停止），
    # 此时用 `docker compose ps` / 监控看到 exited(70) 即为「需要人工介入」的告警信号。
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: ${OJ_REPORT_WORKER_MAX_RESTART_ATTEMPTS:-5}
        delay: 5s
        window: 120s
    environment:
      OJ_DB_HOST: mysql
      OJ_DB_USER: musealgo_app
      TZ: Asia/Shanghai
      OJ_DB_PASS: ${OJ_DB_PASS:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: prod
      OJ_API_DOCS_PUBLIC: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME:-}
      COS_BASE_URL: ${COS_BASE_URL:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      OJ_REDIS_HOST: redis
      OJ_RABBITMQ_ENABLED: "false"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      OJ_SEARCH_ENABLED: "false"
      OJ_SLIDEV_WORKER_DIR: /app/OJ-Slidev
      OJ_SLIDEV_OUTPUT_DIR: /app/OJ-Coursewares
      OJ_TESTCASE_PATH: /data/testcases
      OJ_UPLOAD_DIR: /data/uploads
      OJ_PUBLIC_BASE_URL: ${OJ_PUBLIC_BASE_URL:-}
      JUDGE0_URLS: ${JUDGE0_URLS:-}
      JUDGE0_PER_PROCESS_MEMORY_LIMIT: ${JUDGE0_PER_PROCESS_MEMORY_LIMIT:-true}
      # 判题仍由 backend 承担；本实例只跑报告 worker 与通知 dispatcher。
      OJ_JUDGE_WORKER_ENABLED: "false"
      OJ_REPORT_WORKER_ENABLED: "true"
      OJ_REPORT_NOTIFICATION_WORKER_ENABLED: "true"
      OJ_REPORT_WORKER_EXIT_ON_UNHEALTHY: "true"
      OJ_REPORT_WORKER_THREADS: ${OJ_REPORT_WORKER_THREADS:-2}
      OJ_REPORT_WEEKLY_ENABLED: ${OJ_REPORT_WEEKLY_ENABLED:-false}
      OJ_REPORT_AI_ADVICE_ENABLED: ${OJ_REPORT_AI_ADVICE_ENABLED:-false}
      OJ_REPORT_RETENTION_CLEANUP_ENABLED: ${OJ_REPORT_RETENTION_CLEANUP_ENABLED:-true}
      OJ_REPORT_RETENTION_MONTHS: ${OJ_REPORT_RETENTION_MONTHS:-12}
      OJ_REPORT_RETENTION_CRON: ${OJ_REPORT_RETENTION_CRON:-0 30 3 * * *}
      OJ_SETTLEMENT_REPLAY_ENABLED: ${OJ_SETTLEMENT_REPLAY_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx2g}
      OJ_DB_POOL_SIZE: ${OJ_DB_POOL_SIZE:-20}
    volumes:
      - testcase-data:/data/testcases
      - uploads-data:/data/uploads
      - coursewares-data:/app/OJ-Coursewares
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # 用 readiness 而不是聚合 health：聚合 health 混入 DB/Redis 状态，外部依赖抖动会误判 worker 本身。
      # readiness 只在报告 worker 主动摘流时为 OUT_OF_SERVICE，语义正好对应「需要重启这个实例」。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [backend-net]

  # ---------------- 前端：发行镜像（静态产物 + Nginx，/api 反代后端）----------------
  frontend:
    image: ${FRONTEND_IMAGE:-musealgo-oj/frontend:latest}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    volumes:
      # 课件与上传文件都要能被浏览器直接访问，因此同一份卷只读挂给前端 Nginx
      - coursewares-data:/var/www/coursewares:ro
      - uploads-data:/var/www/uploads:ro
    depends_on:
      backend:
        condition: service_started
    # 站点自身的 liveness 探针：/healthz 只返回 ok，不依赖后端；
    # 后端可用性由上面 backend 的 /actuator/health 探针单独判定。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks: [backend-net]

networks:
  backend-net:

volumes:
  mysql-data:
  redis-data:
  testcase-data:
  uploads-data:
  coursewares-data:
