name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请尽量描述「要解决的问题」而不是「要实现的功能」，这样更容易讨论出更好的方案。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      placeholder: 每次给全班布置作业都要一道一道手动加进题单，很费时间……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      placeholder: 希望能按标签 + 难度自动生成题单……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在你是怎么绕过这个问题的？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 题库与判题
        - 比赛
        - 班级教学
        - 课件
        - AI 助手
        - 社区
        - 学情分析
        - 管理后台
        - 部署与运维
        - 其他
    validations:
      required: true
