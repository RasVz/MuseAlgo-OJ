version: 2

# 依赖版本更新：每月检查，每个生态最多保留一个待处理 PR。
# minor/patch 更新按生态分组；大版本单独审核，安全更新与漏洞告警继续保留。
updates:
  # 后端 Maven 依赖（多模块，统一读根 pom）
  - package-ecosystem: maven
    directory: /OJ-backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    # Spring Boot 保持 3.x；跨主版本迁移需单独验证整套 starter 和业务行为。
    ignore:
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-routine:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # 前端 npm 依赖
  - package-ecosystem: npm
    directory: /OJ-frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-routine:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # GitHub Actions 自身版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-routine:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
