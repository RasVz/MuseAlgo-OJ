version: 2

# 依赖自动更新：每周检查一次，把可升级的依赖提成 PR。
# 这样漏洞公告出来后不必手工盯版本。
updates:
  # 后端 Maven 依赖（多模块，统一读根 pom）
  - package-ecosystem: maven
    directory: /OJ-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 把 Spring 全家桶合并成一个 PR，避免刷屏
      spring:
        patterns:
          - "org.springframework*"

  # 前端 npm 依赖
  - package-ecosystem: npm
    directory: /OJ-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      vue:
        patterns:
          - "vue*"
          - "@vue/*"
      element-plus:
        patterns:
          - "element-plus"
          - "@element-plus/*"

  # GitHub Actions 自身版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
