name: build

# 构建门禁：后端跑单元测试 + 打包，前端跑 ESLint + 构建。
#
# 关于测试范围：需要 MySQL / Redis 的集成测试（OjApplicationTests、*IT）
# 已由 OJ-Backend/pom.xml 的 surefire excludes 默认排除，
# 因此这里无需 -DskipTests —— 跳过全部测试会让 CI 变成「只验证能编译」的假门禁，
# 判题、榜单、查重等核心逻辑被改坏也不会被发现。
# 需要连同集成测试一起验证时，在带数据库的环境执行：./mvnw test -Pintegration
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试与打包 (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 迁移冻结检查需要读取PR目标/推送前提交的Git对象。
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 数据库迁移冻结检查
        id: migration-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            trusted_base="$PR_BASE_SHA"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            trusted_base="origin/$DEFAULT_BRANCH"
          else
            trusted_base="$PUSH_BEFORE_SHA"
          fi
          git rev-parse --verify "${trusted_base}^{commit}" >/dev/null
          echo "ref=$trusted_base" >> "$GITHUB_OUTPUT"
          python3 scripts/check_migrations.py --trusted-base "$trusted_base"

      # package 会先执行 test 阶段：跑完全部单元测试再打包，
      # 因此这一条命令同时覆盖「测试通过」与「产物能构建」两件事
      - name: 单元测试并打包
        working-directory: OJ-Backend
        run: ./mvnw -B package

  frontend:
    name: 前端检查与构建 (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OJ-Frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: OJ-Frontend/package-lock.json

      # 用 npm ci 而非 install：严格按 lock 安装，能提前发现 lock 与 package.json 失同步
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 共享响应处理回归
        run: npm run test:unit

      # 用 lint:ci 而非 lint：后者带 --fix，CI 只应检查、不应改动工作区文件
      - name: 代码检查 (ESLint)
        run: npm run lint:ci

      - name: 构建产物
        run: npm run build
