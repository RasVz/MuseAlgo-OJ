name: secret-scan

# 密钥门禁：扫描当前提交的全部可达历史，包括新建分支和根提交。
# 直接使用 HEAD，避免 action 为根提交构造不存在的 first_commit^。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装已校验的 Gitleaks 并扫描完整历史
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --log-opts=HEAD --redact=100 \
            --report-format=json --report-path="$scanner_dir/results.json"
