name: secret-scan

# 密钥防回归门禁：推送时扫描本次变更，发现密钥模式即失败。
# 仅覆盖提交内容，不做历史全量审计；本地全量扫描：gitleaks detect --verbose
on:
  push:
  pull_request:

permissions:
  contents: read
  # PR 提交列表接口需要只读权限；Dependabot 令牌同样适用。
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
