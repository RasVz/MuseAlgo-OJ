# Judge0 Configuration（MuseAlgo-OJ，由 compose.dev.yml 的 configs 注入到 /judge0.conf）
# 主机名对应 compose.dev.yml 中 judge profile 的服务名。

# Redis connection
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redispassword

# PostgreSQL connection
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0dbpassword
POSTGRES_DB=judge0
