[extend]
useDefault = true

# These exact values are public test fixtures or checksums, not credentials.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic AI upstream key rotation fixture"
condition = "AND"
paths = ['''(?:^|/)OJ-Frontend/tests/e2e/admin-ai-services\.spec\.js$''']
regexTarget = "line"
regexes = ['''(?m)^\+?const ROTATED_KEY = 'sk-e2e-fixture-rotated'$''']

[[rules.allowlists]]
description = "Password generator alphabet"
condition = "AND"
paths = ['''(?:^|/)deploy/verify/synthetic/prepare_synthetic_data\.py$''']
regexTarget = "line"
regexes = ['''(?m)^\+?PASSWORD_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"$''']

[[rules.allowlists]]
description = "Synthetic judge problem title"
condition = "AND"
paths = ['''(?:^|/)deploy/verify/synthetic/judge_matrix\.py$''']
regexTarget = "line"
regexes = ['''(?m)^\+?\s*pid_std = build_problem\(api, teacher_token, "REL02-JUDGE-STD", 1000, 128\)$''']

[[rules.allowlists]]
description = "Verified V69 migration SHA-256 checksum"
condition = "AND"
paths = ['''(?:^|/)OJ-Backend/oj-admin/src/main/resources/db/migration-checksums\.json$''']
regexTarget = "line"
regexes = ['''(?m)^\+?\s*"V69__user_credential_version\.sql": "e25fb16d9da9b0a6df34f6ba03447f85676570e2b63da5b478428b53358d823c",$''']
