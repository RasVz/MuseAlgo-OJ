# 可选开发叠加文件：本地验证管理中心 AI 服务时使用。
# 用法：
#   OJ_AI_MASTER_KEY_FILE_HOST="$PWD/deploy/dev-secrets/oj_ai_master_key" \
#   docker compose -f compose.dev.yml -f deploy/compose.dev.ai-service-secret.yml up -d backend
#
# dev-secrets/ 已在 .gitignore 中排除；不要把真实 Key 或主密钥提交到仓库。
services:
  backend:
    environment:
      OJ_AI_MASTER_KEY_FILE: /run/secrets/oj_ai_master_key
    volumes:
      - ${OJ_AI_MASTER_KEY_FILE_HOST:?set OJ_AI_MASTER_KEY_FILE_HOST to the master-key file}:/run/secrets/oj_ai_master_key:ro
