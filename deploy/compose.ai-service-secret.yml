# 可选叠加文件：仅在启用“管理中心 AI 服务”时使用。
# 用法：
#   OJ_AI_MASTER_KEY_FILE_HOST=/secure/path/oj_ai_master_key \
#   docker compose -f docker-compose.prod.yml -f deploy/compose.ai-service-secret.yml up -d
#
# 主密钥文件要求：32 字节随机值的 Base64（无换行亦可）、只读挂载。
# Linux 发行镜像以 10001:10001 运行，文件属主需匹配并设为 0400；见 docs/AI-SERVICES.md。
# 首次升级默认为 LEGACY；已有 MANAGED 状态不会因取消挂载而自动恢复旧环境。
services:
  backend:
    environment:
      OJ_AI_MASTER_KEY_FILE: /run/secrets/oj_ai_master_key
    volumes:
      - ${OJ_AI_MASTER_KEY_FILE_HOST:?set OJ_AI_MASTER_KEY_FILE_HOST to the master-key file}:/run/secrets/oj_ai_master_key:ro
  report-worker:
    environment:
      OJ_AI_MASTER_KEY_FILE: /run/secrets/oj_ai_master_key
    volumes:
      - ${OJ_AI_MASTER_KEY_FILE_HOST:?set OJ_AI_MASTER_KEY_FILE_HOST to the master-key file}:/run/secrets/oj_ai_master_key:ro
