# MuseAlgo-OJ 前端站点配置（供 deploy/Dockerfile.frontend 使用）
# 若在容器外使用（如宿主直接装 Nginx），请把 $api_upstream 改为后端实际地址。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限保持一致（application.yml: max-request-size 128MB）
    client_max_body_size 128m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Docker 内置 DNS。
    # 关键：后端地址必须「运行时」解析。若在 proxy_pass 里直接写主机名，
    # Nginx 会在启动时就解析它——后端尚未就绪时整个 Nginx 会启动失败
    # （host not found in upstream）。用变量 + resolver 可避免这个问题。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- 单页应用：静态资源优先，找不到则回落 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    # 前端统一以 /api 为前缀，这里去掉前缀后转发给后端（后端自身路径不含 /api）
    location /api/ {
        set $api_upstream "http://backend:8080";

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 助教是流式输出（SSE），必须关闭缓冲并保持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------- 课件静态目录 ----------
    # 对应 oj.slidev.output-dir，容器内期望挂载到 /var/www/coursewares
    location /coursewares/ {
        alias /var/www/coursewares/;
        add_header Cache-Control "no-cache";
    }

    # ---------- 本地上传文件 ----------
    # 未配置对象存储（COS）时，后端把用户上传的图片/报告落在 OJ_UPLOAD_DIR，
    # 并返回相对地址 /uploads/<uuid>.<ext>（file.public-base-url 留空）。
    # 这里把同一个卷只读挂到 /var/www/uploads，补齐浏览器侧的访问闭环。
    #
    # 只读挂载 + 后缀拒绝：上传目录里放的是用户内容，
    # 即使后端已做扩展名白名单与魔数校验，也不让 Nginx 有机会把它当脚本解释。
    location ~* ^/uploads/.*\.(php|phtml|phar|jsp|jspx|asp|aspx|cgi|pl|py|rb|sh|bash|jar|class|exe|dll|so|html?|xhtml|svg|svgz)$ {
        deny all;
    }
    location /uploads/ {
        alias /var/www/uploads/;
        # 文件名由后端以 uuid 生成，内容不会原地变更，可放心长缓存
        expires 7d;
        add_header Cache-Control "public";
        # 防止浏览器把内容嗅探成 HTML/脚本
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
