<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿思学院</title>
    <script>
      // 首帧前应用主题，避免深色模式刷新闪白（FOUC）。
      // 兼容旧值：'1'=深色、'0'=浅色；null/缺失 或 'system'=跟随系统。
      (function () {
        try {
          var q = window.matchMedia('(prefers-color-scheme: dark)')
          function apply() {
            var m = localStorage.getItem('oj-dark-mode')
            var dark = m === '1' || m === 'dark' || ((m === null || m === 'system') && q.matches)
            document.documentElement.classList.toggle('dark', dark)
          }
          apply()
          var init = localStorage.getItem('oj-dark-mode')
          if (init === null || init === 'system') q.addEventListener('change', apply)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
